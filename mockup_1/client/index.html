<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit a Content Idea</title>
    <link rel="stylesheet" href="resources/styles/style.css">
</head>
<body>
    <h1>Submit a Content Idea</h1>
    <p>
        <b>Submit an idea</b> |
        <a href="bank.html">Idea Bank</a> |
        <a href="tracker.html">Production Tracker</a>
    </p>

    <form id="idea-form">
        <p>
            <label for="name">Your name</label><br>
            <input type="text" id="name" name="name">
        </p>
        <p>
            <label for="title">Content name (required)</label><br>
            <input type="text" id="title" name="title" required>
        </p>
        <p>
            <label for="campus">Campus</label><br>
            <input type="text" id="campus" name="campus">
        </p>
        <p>
            <label for="contentType">Content type (the format, e.g. Reel, Photo, Carousel, Story)</label><br>
            <input type="text" id="contentType" name="contentType">
        </p>
        <p>
            <label for="contentCategory">Content category (the topic, e.g. Food, Events, Staff spotlight)</label><br>
            <input type="text" id="contentCategory" name="contentCategory">
        </p>
        <p>
            <label for="concept">Concept</label><br>
            <textarea id="concept" name="concept" rows="4" cols="50"></textarea>
        </p>
        <p>
            <label for="whyItCouldWork">Why it could work</label><br>
            <textarea id="whyItCouldWork" name="whyItCouldWork" rows="3" cols="50"></textarea>
        </p>
        <p>
            <label for="caption">Caption idea</label><br>
            <textarea id="caption" name="caption" rows="3" cols="50"></textarea>
        </p>
        <fieldset>
            <legend>Platform</legend>
            <label><input type="checkbox" name="platforms" value="Instagram"> Instagram</label>
            <label><input type="checkbox" name="platforms" value="TikTok"> TikTok</label>
        </fieldset>
        <p>
            <label for="hashtags">Hashtags</label><br>
            <input type="text" id="hashtags" name="hashtags" placeholder="#summer #recipes">
        </p>
        <fieldset>
            <legend>Photo and video links (optional)</legend>
            <p>
                Put your photo or video in the company OneDrive folder, click <b>Share</b>, then
                <b>Copy link</b>, and paste the link here. Links must start with https://
            </p>
            <div id="links"></div>
            <button type="button" id="add-link">+ Add a link</button>
        </fieldset>
        <p><button type="submit" id="submit-button">Submit idea</button></p>
    </form>

    <p id="message"></p>

    <script src="resources/scripts/common.js"></script>
    <script src="resources/scripts/submit.js"></script>
</body>
</html>
