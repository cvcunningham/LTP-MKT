<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ideas Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="resources/styles/style.css">
</head>
<body data-page="bank">
    <nav id="site-nav"></nav>

    <main class="container mb-5">
        <h1 class="mb-1">Ideas Bank</h1>
        <p class="text-body-secondary">
            <b>Approve</b> moves an idea to the <a href="tracker.html">Production Tracker</a>.
            <b>Deny</b> moves it to "Denied" below, and it is deleted automatically 30 days later.
            Decisions can't be changed.
        </p>

        <h2 class="h4 mt-4">Waiting for review</h2>
        <div id="waiting" class="row g-3"></div>

        <h2 class="h4 mt-5">Denied</h2>
        <div id="rejected" class="row g-3"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="resources/scripts/common.js"></script>
    <script src="resources/scripts/bank.js"></script>
</body>
</html>
