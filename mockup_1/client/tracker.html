<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Production Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="resources/styles/style.css">
</head>
<body data-page="tracker">
    <nav id="site-nav"></nav>

    <main class="container mb-5">
        <h1 class="mb-1">Production Tracker</h1>
        <p class="text-body-secondary">
            Approved ideas, soonest target post date first. Choose who is filming, editing, reviewing
            and posting each one, then click <b>Save</b>. Target post dates show on the
            <a href="content-calendar.html">Content Calendar</a>.
        </p>

        <div class="d-flex align-items-center gap-2 mb-3">
            <label for="view-filter" class="form-label mb-0">Show</label>
            <select id="view-filter" class="form-select w-auto">
                <option value="InProgress">In progress</option>
                <option value="Completed">Completed</option>
            </select>
        </div>

        <div id="items" class="row g-3"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="resources/scripts/common.js"></script>
    <script src="resources/scripts/tracker.js"></script>
</body>
</html>
