<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Content Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="resources/styles/style.css">
</head>
<body data-page="content-calendar">
    <nav id="site-nav"></nav>

    <main class="container mb-5">
        <h1 class="mb-1">Content Calendar</h1>
        <p class="text-body-secondary">
            Target post dates from the <a href="tracker.html">Production Tracker</a>. Click an item for its details.
            Ideas without a target date aren't shown.
        </p>

        <div id="color-key" class="mb-3"></div>
        <div id="load-message"></div>
        <div id="calendar"></div>
    </main>

    <!-- Details pop-up (view only; editing happens in the Production Tracker) -->
    <div class="modal fade" id="details" tabindex="-1" aria-labelledby="details-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="details-title"></h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="details-body"></div>
                <div class="modal-footer">
                    <a class="btn btn-primary" id="details-open">Open in Production Tracker</a>
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="resources/scripts/common.js"></script>
    <script src="resources/scripts/calendar.js"></script>
    <script src="resources/scripts/content-calendar.js"></script>
</body>
</html>
